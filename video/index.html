<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ripping reel</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("file:///usr/share/fonts/truetype/macos/Inter-Regular.ttf") format("truetype");
    font-weight: 400;
  }
  @font-face {
    font-family: "Inter";
    src: url("file:///usr/share/fonts/truetype/macos/Inter-Medium.ttf") format("truetype");
    font-weight: 500;
  }
  @font-face {
    font-family: "Inter";
    src: url("file:///usr/share/fonts/truetype/macos/Inter-SemiBold.ttf") format("truetype");
    font-weight: 600;
  }
  @font-face {
    font-family: "Inter";
    src: url("file:///usr/share/fonts/truetype/macos/Inter-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #000;
    font-family: Inter, sans-serif;
  }
  #stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #eef1f6;
  }
  #bg-light, #bg-dark {
    position: absolute;
    inset: 0;
  }
  #bg-light {
    background:
      radial-gradient(900px 700px at 50% 18%, #ffffff 0%, rgba(255,255,255,0) 70%),
      linear-gradient(180deg, #f7f8fb 0%, #e7ebf2 100%);
  }
  #bg-dark {
    opacity: 0;
    background:
      radial-gradient(800px 600px at 50% 22%, #243044 0%, rgba(20,24,32,0) 68%),
      linear-gradient(180deg, #1a2030 0%, #10141c 100%);
  }
  #squares { position: absolute; inset: 0; pointer-events: none; }
  .sq {
    position: absolute;
    border-radius: 10px;
    background: #d5dbe6;
    left: 0;
    top: 0;
  }
  #bg-dark.show-sq .sq { background: #2a3344; }

  #logo {
    position: absolute;
    top: 54px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 8;
  }
  #logo img.mark {
    width: 54px;
    height: 54px;
    display: block;
  }
  #logo .word {
    font-weight: 700;
    font-size: 40px;
    letter-spacing: -0.04em;
    color: #16181d;
  }
  #logo.on-dark .word { color: #fff; }
  #logo.on-dark img.mark { filter: invert(1); }

  .scene {
    position: absolute;
    left: 0;
    right: 0;
    top: 150px;
    z-index: 4;
    opacity: 0;
  }
  .cap {
    padding: 0 72px;
    text-align: center;
    font-weight: 700;
    font-size: 78px;
    line-height: 0.98;
    letter-spacing: -0.045em;
    color: #14171c;
  }
  .cap.sm { font-size: 68px; }
  .cap em {
    font-style: normal;
    color: #2563eb;
  }
  .on-dark-cap { color: #fff; }
  .on-dark-cap em { color: #6ea2ff; }

  .card-wrap {
    margin-top: 36px;
    display: flex;
    justify-content: center;
    padding: 0 70px;
  }
  .card {
    width: 860px;
    background: #fff;
    border-radius: 32px;
    box-shadow: 0 30px 70px rgba(20, 28, 45, 0.12);
    padding: 28px 32px 30px;
    color: #1a1d24;
  }
  .card.dark {
    background: #1c2330;
    color: #f4f7fb;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
  }
  .kicker {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8b93a3;
    font-weight: 600;
    margin-bottom: 18px;
  }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #16a34a;
    letter-spacing: 0;
    text-transform: none;
    font-size: 18px;
  }
  .live i {
    width: 10px; height: 10px; border-radius: 50%; background: #22c55e; display: inline-block;
  }
  .race-row, .tool-row, .svc-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 26px;
    color: #6b7280;
  }
  .race-row.on, .tool-row.on {
    background: #eef4ff;
    color: #1d4ed8;
  }
  .bar {
    margin-left: auto;
    height: 8px;
    border-radius: 99px;
    background: #e5e7eb;
    width: 120px;
    overflow: hidden;
  }
  .bar span { display: block; height: 100%; background: #cbd5e1; border-radius: 99px; }
  .race-row.on .bar { background: #dbe7ff; width: 180px; }
  .race-row.on .bar span { background: #2563eb; width: 92%; }
  .mark-dot {
    width: 28px; height: 28px; border-radius: 8px; background: #e5e7eb; flex: none;
  }
  .mark-dot.blue { background: #2563eb; }

  .win-top {
    display: flex; align-items: center; gap: 8px;
    background: #f3f4f6; border-radius: 14px; padding: 10px 14px; margin-bottom: 16px;
    color: #6b7280; font-size: 18px; font-weight: 600;
  }
  .card.dark .win-top { background: #121722; color: #9aa3b5; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; display: block; }
  .dots i:nth-child(1) { background: #f87171; }
  .dots i:nth-child(2) { background: #fbbf24; }
  .dots i:nth-child(3) { background: #34d399; }

  .big-name { font-size: 42px; font-weight: 700; letter-spacing: -0.04em; }
  .sub { color: #8b93a3; font-weight: 600; font-size: 20px; margin-top: 4px; }
  .pill {
    display: inline-flex; align-items: center;
    background: #e8f0ff; color: #2563eb;
    border-radius: 999px; padding: 8px 16px;
    font-weight: 700; font-size: 22px;
  }
  .pill.red { background: #fee2e2; color: #dc2626; }
  .pill.gray { background: #f3f4f6; color: #4b5563; }
  .line {
    height: 14px; border-radius: 8px; background: #eef2f7; margin-top: 12px;
  }
  .line.s { width: 46%; }
  .line.m { width: 72%; }
  .line.l { width: 88%; }
  .progress {
    margin-top: 18px; height: 12px; background: #e8eef8; border-radius: 99px; overflow: hidden;
  }
  .progress span {
    display: block; height: 100%; width: 38%;
    background: linear-gradient(90deg, #93c5fd, #2563eb);
  }
  .quote {
    font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.25;
  }
  .btn {
    display: inline-block; margin-top: 18px;
    background: #2563eb; color: #fff; font-weight: 700;
    border-radius: 999px; padding: 14px 22px; font-size: 22px;
  }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .mini {
    background: #fff; border-radius: 22px; padding: 18px 20px;
    box-shadow: 0 12px 30px rgba(16,24,40,.06);
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 700; font-size: 26px;
  }
  .mini .left { display: flex; align-items: center; gap: 12px; }
  .chart-box { margin-top: 8px; }
  .chart-box svg { width: 100%; height: 180px; display: block; }
  .legend { display: flex; justify-content: space-between; color: #9aa3b2; font-weight: 600; font-size: 18px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat {
    background: #121722; border-radius: 20px; padding: 18px;
  }
  .stat b { display: block; font-size: 22px; margin-bottom: 8px; }
  .sign {
    margin: 10px auto 0; width: 100%;
    background: #fff; border-radius: 28px; padding: 28px 22px;
    box-shadow: 0 16px 40px rgba(16,24,40,.08);
    text-align: center; font-size: 34px; font-weight: 700; letter-spacing: -0.03em;
  }
  .qmark {
    width: 64px; height: 64px; border-radius: 50%;
    border: 4px solid #ef4444; color: #ef4444;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 36px; margin-left: auto;
  }
  .coins { display: flex; align-items: flex-end; justify-content: center; gap: 80px; padding: 10px 0 6px; }
  .coin-col { text-align: center; font-weight: 700; }
  .coin {
    border-radius: 50%; margin: 0 auto 12px;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.08);
  }
  .coin.sm { width: 90px; height: 90px; background: #c5cad3; }
  .coin.lg { width: 170px; height: 170px; background: radial-gradient(circle at 35% 35%, #8eb6ff, #2563eb 62%); }
  .coin-col span { display: block; color: #6b7280; font-size: 20px; }
  .services { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .services span {
    background: #f3f6fb; border-radius: 16px; padding: 16px 18px;
    font-weight: 700; font-size: 24px;
  }
  .stamp {
    display: inline-block; border: 6px solid #16a34a; color: #16a34a;
    font-weight: 800; letter-spacing: 0.08em; font-size: 42px;
    padding: 6px 18px; border-radius: 12px; transform: rotate(-8deg);
  }
  .strike { text-decoration: line-through; color: #ef4444; }
  .comment {
    margin-top: 8px; background: #1c2330; color: #fff;
    border-radius: 999px; display: flex; align-items: center; gap: 14px;
    padding: 16px 18px 16px 22px; font-size: 32px; font-weight: 700;
  }
  .send {
    margin-left: auto; width: 54px; height: 54px; border-radius: 50%;
    background: #2563eb; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 26px;
  }
  .hash { color: #60a5fa; }
  .deck {
    background: #121722; border-radius: 24px; padding: 22px;
  }
  .deck-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .ap {
    font-weight: 800; letter-spacing: 0.12em; color: #60a5fa; font-size: 28px;
  }
  .copilot {
    margin-top: 16px; text-align: center; font-weight: 800; letter-spacing: 0.14em;
    color: #6b7280; font-size: 28px; text-decoration: line-through;
  }
  .end-lockup { text-align: center; }
  .end-lockup img.mark { width: 112px; height: 112px; }
  .end-lockup .brand {
    font-size: 68px; font-weight: 700; letter-spacing: -0.05em; margin-top: 4px; color: #14171c;
  }
  .end-lockup .url { color: #9aa3b2; font-weight: 600; font-size: 24px; margin-top: -4px; }
  .profile {
    width: 760px; margin: 18px auto 0; display: block; border-radius: 26px;
    box-shadow: 0 24px 50px rgba(16,24,40,.12);
  }
  #avatar {
    position: absolute;
    left: 50%;
    bottom: -70px;
    width: 1000px;
    height: 1140px;
    z-index: 6;
    pointer-events: none;
  }
  #avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
  }
  #ground {
    position: absolute;
    left: 50%;
    bottom: 18px;
    width: 520px;
    height: 40px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,.28), rgba(0,0,0,0) 70%);
    z-index: 5;
    pointer-events: none;
  }
</style>
</head>

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function smooth(x) {
  x = clamp(x, 0, 1);
  return x * x * (3 - 2 * x);
}
function seg(t, a, b, fadeIn, fadeOut) {
  if (t < a || t > b) return 0;
  const inn = fadeIn <= 0 ? 1 : smooth((t - a) / fadeIn);
  const out = fadeOut <= 0 ? 1 : smooth((b - t) / fadeOut);
  return Math.min(inn, out);
}

function poseWeights(t) {
  const FADE = 0.7;
  const w = Object.fromEntries(POSES.map((p) => [p, 0]));
  const last = POSE_AT.length - 1;
  for (let i = 0; i < POSE_AT.length; i++) {
    const t0 = POSE_AT[i][0];
    const t1 = i < last ? POSE_AT[i + 1][0] : 1000;
    const lead = i === 0 ? 0 : FADE;
    if (t < t0 - lead || t >= t1) continue;
    const fadeIn = i === 0 ? 1 : smooth((t - (t0 - FADE)) / FADE);
    const fadeOut = i === last ? 1 : smooth((t1 - t) / FADE);
    w[POSE_AT[i][1]] = Math.min(fadeIn, fadeOut);
  }
  const sum = Object.values(w).reduce((a, b) => a + b, 0) || 1;
  for (const k in w) w[k] /= sum;
  return w;
}

function renderFrame(t) {
  let dark = 0;
  let endA = 0;
  for (const s of SCENES) {
    const fadeIn = s.t0 < 0.05 ? 0.35 : 0.52;
    const fadeOut = s.fadeOut === 0 ? 0 : 0.5;
    const a = seg(t, s.t0, s.t1, fadeIn, fadeOut);
    const enter = smooth(clamp((t - s.t0) / 0.6, 0, 1));
    s.el.style.opacity = a.toFixed(4);
    s.el.style.transform = `translateY(${((1 - enter) * 34).toFixed(2)}px)`;
    if (s.theme === "dark") dark += a;
    if (s.end) endA = a;
  }
  dark = clamp(dark, 0, 1);
  bgDark.style.opacity = dark.toFixed(4);
  logo.style.opacity = (1 - endA).toFixed(4);
  logo.classList.toggle("on-dark", dark > 0.45);

  for (const sq of squares.children) {
    const i = Number(sq.dataset.i);
    const x = Number(sq.dataset.x) + Math.sin(t * 0.22 + i) * 18;
    const y = Number(sq.dataset.y) + Math.cos(t * 0.16 + i * 0.8) * 16;
    sq.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    sq.style.background = dark > 0.45 ? "#2c3548" : "#d7dee8";
    sq.style.opacity = dark > 0.45 ? "0.55" : "0.9";
  }

  const weights = poseWeights(t);
  const bob = Math.sin(t * 1.15) * 7;
  const drop = endA * 120;
  avatar.style.transform = `translateX(-50%) translateY(${(bob + drop).toFixed(2)}px)`;
  for (const img of avatar.children) {
    img.style.opacity = (weights[img.dataset.pose] || 0).toFixed(4);
  }
}

window.renderFrame = renderFrame;
renderFrame(0);
